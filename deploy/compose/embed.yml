# PureEmbeddingServer-backed deployment (OpenAI /v1/embeddings proxy).
#
# Two services share two volumes:
#   - hf-hub-cache  shared HF cache (mountPath /cache/hf/hub).
#                   llm-init writes; embed reads when MODEL_SOURCE is hf://.
#   - run-state     ephemeral sentinel + model_path. Produced by llm-init,
#                   consumed by deploy/wrappers/embed.sh as EMBED_MODEL_DIR.
#                   llm-init also publishes wrappers/common.sh here; set
#                   WRAPPER_COMMON on the engine to source that copy, which
#                   is what a Market chart does (its ConfigMap carries only
#                   embed.sh). Left unset here so the bind-mounted sibling
#                   copy wins and a compose run tests the local edit.
#
# Quickstart:
#   cp deploy/compose/.env.example .env
#   # set MODEL_ID + MODEL_NAME (logical name from PureEmbeddingServer registry)
#   docker compose -f deploy/compose/embed.yml --env-file .env up
#
# Naming contract (PureEmbeddingServer has no MODEL_NAME env):
#   - embed container: MODEL_ID only (registry id, e.g. embeddinggemma-300m-ov)
#   - llm-init container: MODEL_NAME = ModelSpec.model_name for that MODEL_ID
#     (e.g. embeddinggemma-300m) so /v1/models Ready matches proxy rewrite.
#   - Neither container sets ENGINE_ARGS (Embed uses native EMBED_* env).
#

name: llm-init-embed

services:
  llm-init:
    image: ${LLM_INIT_IMAGE:-docker.io/beclab/llm-init:v1.2.1}
    environment:
      ENGINE_KIND: embed
      MODEL_NAME: ${MODEL_NAME}
      MODEL_MODE: ${MODEL_MODE:-embedding}
      MODEL_SUPPORTS: ${MODEL_SUPPORTS:-}
      MODEL_SOURCE: ${MODEL_SOURCE}
      MODEL_SOURCE_LOCAL: ${MODEL_SOURCE_LOCAL:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_TOKEN: ${HF_TOKEN:-}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - type: ${HF_CACHE_KIND:-volume}
        source: ${HF_CACHE_SOURCE:-hf-hub-cache}
        target: /cache/hf/hub
      - run-state:/run/llm-init
    ports:
      - "${LLM_INIT_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/llm-init", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  embed:
    # Pin to your PureEmbeddingServer build (OpenVINO IR on Intel, ONNX on NVIDIA, etc.).
    image: ${EMBED_IMAGE:-embed-server:ov-intel-amd64}
    depends_on:
      llm-init:
        condition: service_healthy
    volumes:
      - ../wrappers:/llm-init/wrappers:ro
      - type: ${HF_CACHE_KIND:-volume}
        source: ${HF_CACHE_SOURCE:-hf-hub-cache}
        target: /cache/hf/hub
        read_only: true
      - run-state:/run/llm-init:ro
    environment:
      MODEL_ID: ${MODEL_ID}
      EMBED_DEVICE: ${EMBED_DEVICE:-auto}
      EMBED_ALLOW_CPU_FALLBACK: ${EMBED_ALLOW_CPU_FALLBACK:-1}
      EMBED_HOST: ${EMBED_HOST:-0.0.0.0}
      EMBED_PORT: ${EMBED_PORT:-8080}
      WAIT_TIMEOUT: ${WAIT_TIMEOUT:-3600}
      EMBED_SERVER_BIN: ${EMBED_SERVER_BIN:-}
    entrypoint: ["/bin/sh", "/llm-init/wrappers/embed.sh"]
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  hf-hub-cache:
  run-state:
