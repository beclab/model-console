# rerank-server-backed deployment (OpenAI POST /v1/rerank proxy).
#
# Two services share two volumes:
#   - hf-hub-cache  shared HF cache (mountPath /cache/hf/hub).
#                   llm-init writes; rerank reads when MODEL_SOURCE is hf://.
#   - run-state     ephemeral sentinel + model_path. Produced by llm-init,
#                   consumed by deploy/wrappers/rerank.sh as MODEL_DIR.
#                   llm-init also publishes wrappers/common.sh here; set
#                   WRAPPER_COMMON on the engine to source that copy, which
#                   is what a Market chart does (its ConfigMap carries only
#                   rerank.sh). Left unset here so the bind-mounted sibling
#                   copy wins and a compose run tests the local edit.
#
# Quickstart:
#   cp deploy/compose/.env.example .env
#   # set MODEL_NAME = MODEL_ID (same string, e.g. bge-reranker-v2-m3)
#   docker compose -f deploy/compose/rerank.yml --env-file .env up
#
# Naming contract (rerank-server has no MODEL_NAME env):
#   - rerank container: MODEL_ID only (registry id, e.g. bge-reranker-v2-m3)
#   - llm-init container: MODEL_NAME must equal MODEL_ID so /v1/models Ready
#     matches proxy rewrite (see deploy/compose/.env.example).
#   - Neither container sets ENGINE_ARGS (rerank uses native RERANK_* env).
#

name: llm-init-rerank

services:
  llm-init:
    image: ${LLM_INIT_IMAGE:-docker.io/beclab/llm-init:v1.2.1}
    environment:
      ENGINE_KIND: rerank
      MODEL_NAME: ${MODEL_NAME}
      MODEL_MODE: ${MODEL_MODE:-rerank}
      MODEL_SUPPORTS: ${MODEL_SUPPORTS:-}
      MODEL_SOURCE: ${MODEL_SOURCE}
      MODEL_SOURCE_LOCAL: ${MODEL_SOURCE_LOCAL:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_TOKEN: ${HF_TOKEN:-}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - type: ${HF_CACHE_KIND:-volume}
        source: ${HF_CACHE_SOURCE:-hf-hub-cache}
        target: /cache/hf/hub
      - run-state:/run/llm-init
    ports:
      - "${LLM_INIT_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/llm-init", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rerank:
    # Pin to your rerank-server build (OpenVINO IR on Intel, ONNX on NVIDIA, etc.).
    image: ${RERANK_IMAGE:-rerank-server:ov-intel-amd64}
    depends_on:
      llm-init:
        condition: service_healthy
    volumes:
      - ../wrappers:/llm-init/wrappers:ro
      - type: ${HF_CACHE_KIND:-volume}
        source: ${HF_CACHE_SOURCE:-hf-hub-cache}
        target: /cache/hf/hub
        read_only: true
      - run-state:/run/llm-init:ro
    environment:
      MODEL_ID: ${MODEL_ID}
      ACCELERATOR: ${ACCELERATOR}
      RERANK_RUNTIME: ${RERANK_RUNTIME:-}
      RERANK_HOST: ${RERANK_HOST:-0.0.0.0}
      RERANK_PORT: ${RERANK_PORT:-8080}
      WAIT_TIMEOUT: ${WAIT_TIMEOUT:-3600}
      RERANK_SERVER_BIN: ${RERANK_SERVER_BIN:-}
    entrypoint: ["/bin/sh", "/llm-init/wrappers/rerank.sh"]
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  hf-hub-cache:
  run-state:
