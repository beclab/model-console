# llama.cpp-backed deployment. CPU-friendly (the integration test in
# tests/integration/llamacpp/ uses this exact file with a tiny GGUF).
#
# Quickstart:
#   cp deploy/compose/.env.example .env
#   docker compose -f deploy/compose/llamacpp.yml --env-file .env up
#
# v1.1.0 contracts:
#   - Single ENGINE_ARGS env on both containers (engine-native cmdline
#     OR LLAMA_ARG_* env; auto-detected by deploy/wrappers/llamacpp.sh).
#   - Shared HF cache mount at /cache/hf/hub (volume
#     source controlled by HF_CACHE_KIND/SOURCE).
#   - The model-spec is seeded from MODEL_MODE (+ optional MODEL_SUPPORTS)
#     on first boot and persisted at MODEL_SPEC_PATH (default
#     ${RUN_DIR}/model-spec.json); it is then editable via the dashboard
#     API tab. To ship a richer spec instead, see the optional mount below.
#

name: llm-init-llamacpp

services:
  llm-init:
    image: ${LLM_INIT_IMAGE:-docker.io/beclab/llm-init:v1.2.1}
    environment:
      ENGINE_KIND: llamacpp
      MODEL_NAME: ${MODEL_NAME}
      MODEL_MODE: ${MODEL_MODE:-chat}
      MODEL_SUPPORTS: ${MODEL_SUPPORTS:-}
      MODEL_SOURCE: ${MODEL_SOURCE}
      MODEL_SOURCE_LOCAL: ${MODEL_SOURCE_LOCAL:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_TOKEN: ${HF_TOKEN:-}
      ENGINE_ARGS: ${ENGINE_ARGS:-}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # To ship a full capability spec (label / context_size / pricing)
      # instead of the env-seeded defaults, mount a file (volumes below)
      # and point MODEL_SPEC_PATH at it so disk wins over the env seed:
      # MODEL_SPEC_PATH: /etc/llm-init/model-spec.json
    volumes:
      - type: ${HF_CACHE_KIND:-volume}
        source: ${HF_CACHE_SOURCE:-hf-hub-cache}
        target: /cache/hf/hub
      - run-state:/run/llm-init
      # Optional full spec (pair with MODEL_SPEC_PATH above):
      # - ./model-spec.json:/etc/llm-init/model-spec.json:ro
    ports:
      - "${LLM_INIT_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/llm-init", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  llamacpp:
    # Pinned to a specific server build (matches the other three engines'
    # version pins and SECURITY.md's hardening checklist). Bump via
    # https://github.com/ggml-org/llama.cpp/pkgs/container/llama.cpp.
    image: ghcr.io/ggml-org/llama.cpp:server-b9128
    depends_on:
      llm-init:
        condition: service_healthy
    volumes:
      - ../wrappers:/llm-init/wrappers:ro
      - type: ${HF_CACHE_KIND:-volume}
        source: ${HF_CACHE_SOURCE:-hf-hub-cache}
        target: /cache/hf/hub
        read_only: true
      - run-state:/run/llm-init:ro
    environment:
      ENGINE_KIND: llamacpp
      MODEL_NAME: ${MODEL_NAME}
      LLAMACPP_PORT: ${LLAMACPP_PORT:-8081}
      WAIT_TIMEOUT: ${WAIT_TIMEOUT:-3600}
      # Same value llm-init received: wrapper transforms it to the
      # engine's native cmdline / LLAMA_ARG_* env.
      ENGINE_ARGS: ${ENGINE_ARGS:-}
    entrypoint: ["/bin/sh", "/llm-init/wrappers/llamacpp.sh"]
    # The wrapper waits for llm-init's sentinel before exec'ing the
    # engine, so the inherited /health probe would 503 throughout
    # the cold-deploy download window. Readiness is gated by llm-init's
    # /readyz.
    healthcheck:
      disable: true
    # llama.cpp runs CPU-only by default; uncomment the deploy block to
    # request GPUs. The CI llamacpp integration test in
    # tests/integration/llamacpp uses CPU mode against a tiny GGUF.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

# Top-level volume declarations only fire when HF_CACHE_KIND=volume and
# the SOURCE name matches an entry below. For bind mounts (KIND=bind),
# docker creates the bind on the fly from the SOURCE path. For external
# named volumes, use a compose override file:
#   docker compose -f llamacpp.yml -f my-external-volumes.yml up
volumes:
  hf-hub-cache:
  run-state:
