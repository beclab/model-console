# Ollama-backed deployment. The Ollama daemon owns the model bytes
# (no HF cache mount on llm-init); llm-init drives /api/pull and
# exposes the OpenAI-compatible /v1/* surface translated against
# /api/chat.
#
# Quickstart:
#   cp deploy/compose/.env.example .env
#   docker compose -f deploy/compose/ollama.yml --env-file .env up
#
# Then send requests to http://localhost:${LLM_INIT_PORT:-8080}/v1/...
#
# v1.1.0 contracts:
#   - Single ENGINE_ARGS env on both containers. For ollama the value
#     is a KEY=VALUE list of OLLAMA_* daemon env (deploy/wrappers/ollama.sh
#     export's them before exec'ing `ollama serve`).
#   - llm-init talks to the daemon over HTTP only; no /root/.ollama
#     mount on llm-init.
#

name: llm-init-ollama

services:
  ollama:
    # Pinned to 0.30.0; bump via https://github.com/ollama/ollama/releases.
    image: ollama/ollama:0.30.0
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # OLLAMA_NOPRUNE=1 prevents the daemon from garbage-collecting
      # blobs we just pushed.
      OLLAMA_NOPRUNE: "1"
      # Same value llm-init received: wrapper expands the KEY=VALUE list
      # into export'd env before `ollama serve`.
      ENGINE_KIND: ollama
      ENGINE_ARGS: ${ENGINE_ARGS:-}
    entrypoint: ["/bin/sh", "/llm-init/wrappers/ollama.sh"]
    volumes:
      - ../wrappers:/llm-init/wrappers:ro
      - type: ${OLLAMA_DATA_KIND:-volume}
        source: ${OLLAMA_DATA_SOURCE:-ollama-data}
        target: /root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  llm-init:
    image: ${LLM_INIT_IMAGE:-docker.io/beclab/llm-init:v1.2.1}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      ENGINE_KIND: ollama
      MODEL_NAME: ${MODEL_NAME}
      MODEL_MODE: ${MODEL_MODE:-chat}
      MODEL_SUPPORTS: ${MODEL_SUPPORTS:-}
      MODEL_SOURCE: ${MODEL_SOURCE}
      MODEL_SOURCE_LOCAL: ${MODEL_SOURCE_LOCAL:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_TOKEN: ${HF_TOKEN:-}
      ENGINE_ARGS: ${ENGINE_ARGS:-}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    # llm-init talks to the ollama daemon via HTTP API (/api/tags,
    # /api/show, /api/pull, /api/blobs, /api/create); it does NOT
    # read /root/.ollama directly, so no ollama-data mount is needed
    # on this container. The model-spec is seeded from MODEL_MODE
    # (+ optional MODEL_SUPPORTS) and persisted at MODEL_SPEC_PATH
    # (default ${RUN_DIR}/model-spec.json). To ship a full spec instead,
    # mount a file and point MODEL_SPEC_PATH at it (disk wins):
    #   environment:
    #     MODEL_SPEC_PATH: /etc/llm-init/model-spec.json
    #   volumes:
    #     - ./model-spec.json:/etc/llm-init/model-spec.json:ro
    ports:
      - "${LLM_INIT_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/llm-init", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama-data:
