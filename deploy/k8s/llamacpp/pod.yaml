# llama.cpp Pod manifest. CPU-friendly variant -- no GPU resources are
# requested by default (uncomment the `nvidia.com/gpu` lines for CUDA).
#
# v1.1.0 contracts: see deploy/k8s/vllm/pod.yaml header.
#
# Customise:
#   <MODEL_NAME>           e.g. tinyllama-q4
#   <MODEL_SOURCE>         e.g. hf://TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF --include tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
#   <ENGINE_ARGS>          e.g. -c 2048 -ngl all
#   <HF_PVC>               RWX PVC for the shared HF cache (~600 MB for TinyLlama Q4)
#   <SPEC_CONFIGMAP>       (optional) ConfigMap holding model-spec.json; only
#                          if you uncomment the model-spec volume + mount below
#   <LLM_INIT_IMAGE>       pinned llm-init image
apiVersion: v1
kind: Pod
metadata:
  name: <MODEL_NAME>
  labels:
    app.kubernetes.io/name: llm-init
    app.kubernetes.io/component: <MODEL_NAME>
    llm-init.io/engine: llamacpp
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: hf-cache
      persistentVolumeClaim:
        claimName: <HF_PVC>
    - name: run-state
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
    - name: wrappers
      configMap:
        name: llm-init-wrappers
        defaultMode: 0o555
    # Optional: ship a full capability spec via ConfigMap instead of the
    # MODEL_MODE/MODEL_SUPPORTS env seed. Uncomment this volume, the
    # matching volumeMount, and the MODEL_SPEC_PATH env below.
    # - name: model-spec
    #   configMap:
    #     name: <SPEC_CONFIGMAP>
    #     items:
    #       - key: model-spec.json
    #         path: model-spec.json
  containers:
    - name: llm-init
      image: <LLM_INIT_IMAGE>
      imagePullPolicy: IfNotPresent
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        - { name: ENGINE_KIND,    value: llamacpp }
        - { name: MODEL_NAME,     value: <MODEL_NAME> }
        - { name: MODEL_MODE,     value: chat }
        # - { name: MODEL_SUPPORTS, value: "supports_reasoning,supports_vision" }
        - { name: MODEL_SOURCE,   value: "<MODEL_SOURCE>" }
        - { name: HF_ENDPOINT,    value: "https://huggingface.co" }
        - { name: ENGINE_ARGS,    value: "<ENGINE_ARGS>" }
        - { name: RUN_DIR,        value: /run/llm-init }
        - { name: PORT,           value: "8080" }
        - { name: LOG_LEVEL,      value: info }
        - { name: LOG_FORMAT,     value: json }
        # Pair with the optional model-spec ConfigMap (disk wins over env):
        # - { name: MODEL_SPEC_PATH, value: /etc/llm-init/model-spec.json }
      ports:
        - { containerPort: 8080, name: http }
      volumeMounts:
        - { name: hf-cache,   mountPath: /cache/hf/hub }
        - { name: run-state,  mountPath: /run/llm-init }
        # - { name: model-spec, mountPath: /etc/llm-init/model-spec.json, subPath: model-spec.json, readOnly: true }
      livenessProbe:
        httpGet: { path: /livez, port: 8080 }
        periodSeconds: 30
      readinessProbe:
        httpGet: { path: /readyz, port: 8080 }
        periodSeconds: 5
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    - name: engine
      # Pinned to a specific server build (matches the other three engines'
      # version pins and SECURITY.md's hardening checklist). Bump via
      # https://github.com/ggml-org/llama.cpp/pkgs/container/llama.cpp.
      image: ghcr.io/ggml-org/llama.cpp:server-b9128
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "/llm-init/wrappers/llamacpp.sh"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        - { name: ENGINE_KIND,   value: llamacpp }
        - { name: MODEL_NAME,    value: <MODEL_NAME> }
        - { name: LLAMACPP_PORT, value: "8081" }
        - { name: WAIT_TIMEOUT,  value: "3600" }
        - { name: ENGINE_ARGS,   value: "<ENGINE_ARGS>" }
      volumeMounts:
        - { name: hf-cache,  mountPath: /cache/hf/hub, readOnly: true }
        - { name: run-state, mountPath: /run/llm-init, readOnly: true }
        - { name: wrappers,  mountPath: /llm-init/wrappers, readOnly: true }
      ports:
        - { containerPort: 8081, name: llamacpp }
      readinessProbe:
        httpGet: { path: /v1/models, port: 8081 }
        initialDelaySeconds: 30
        periodSeconds: 5
        failureThreshold: 60
      resources:
        requests:
          cpu: 1
          memory: 2Gi
        limits:
          cpu: 4
          memory: 8Gi
        # GPU users uncomment:
        # requests:
        #   nvidia.com/gpu: 1
        # limits:
        #   nvidia.com/gpu: 1
