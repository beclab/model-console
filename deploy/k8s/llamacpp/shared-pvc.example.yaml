# Example shared HF cache PVC for the llama.cpp Pod template.
# llama.cpp typically serves single-file GGUFs which are smaller than
# safetensors checkpoints (~5 GB for a 7B Q4_K_M); 20 GiB is enough
# for several concurrent variants on the same cluster. Bump as needed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-hub-cache
spec:
  accessModes: [ReadWriteMany]
  storageClassName: <your-rwx-storage-class>
  resources:
    requests:
      storage: 20Gi
---
# OPTIONAL: only needed if you uncomment the model-spec volume/mount +
# MODEL_SPEC_PATH env in pod.yaml. Otherwise MODEL_MODE (+ MODEL_SUPPORTS)
# seeds the spec and this ConfigMap can be skipped.
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-spec-<MODEL_NAME>
data:
  model-spec.json: |
    {
      "name": "<MODEL_NAME>",
      "mode": "chat",
      "label": { "en_US": "<MODEL_NAME>" },
      "supports": { "supports_native_streaming": true },
      "context_size": 8192
    }
