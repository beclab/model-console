# Ollama Pod manifest. Inverse shape from vLLM/SGLang/llama.cpp: the
# Ollama daemon owns the model bytes (mounted at /root/.ollama in the
# daemon container ONLY -- llm-init reads via HTTP API).
#
# v1.1.0 contracts:
#   - Single ENGINE_ARGS env on both containers (KEY=VALUE list of
#     OLLAMA_* daemon env). The wrapper exports each token.
#   - The model-spec is seeded from MODEL_MODE (+ optional MODEL_SUPPORTS)
#     and persisted at MODEL_SPEC_PATH (default ${RUN_DIR}/model-spec.json,
#     the run-state emptyDir). To ship a fuller spec, uncomment the
#     model-spec ConfigMap volume/mount + MODEL_SPEC_PATH env below.
#
# Customise:
#   <MODEL_NAME>           e.g. qwen2.5-7b-instruct
#   <MODEL_SOURCE>         e.g. ollama://qwen2.5:7b-instruct
#   <ENGINE_ARGS>          e.g. OLLAMA_NUM_CTX=8192 OLLAMA_KEEP_ALIVE=30m
#   <OLLAMA_PVC>           RWO PVC for /root/.ollama (no cross-Pod sharing
#                          recommended; one PVC per Pod for daemon data)
#   <SPEC_CONFIGMAP>       (optional) ConfigMap holding model-spec.json; only
#                          if you uncomment the model-spec volume + mount below
#   <LLM_INIT_IMAGE>       pinned llm-init image
apiVersion: v1
kind: Pod
metadata:
  name: <MODEL_NAME>
  labels:
    app.kubernetes.io/name: llm-init
    app.kubernetes.io/component: <MODEL_NAME>
    llm-init.io/engine: ollama
spec:
  restartPolicy: Always
  # Note: runAsNonRoot is NOT at pod level here because the upstream
  # ollama/ollama image writes to /root/.ollama and would fail to start
  # under runAsNonRoot. We pin llm-init to non-root via its own
  # container-level securityContext below.
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: ollama-data
      persistentVolumeClaim:
        claimName: <OLLAMA_PVC>
    - name: run-state
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
    - name: wrappers
      configMap:
        name: llm-init-wrappers
        defaultMode: 0o555
    # Optional: ship a full capability spec via ConfigMap instead of the
    # MODEL_MODE/MODEL_SUPPORTS env seed. Uncomment this volume, the
    # matching volumeMount, and the MODEL_SPEC_PATH env below.
    # - name: model-spec
    #   configMap:
    #     name: <SPEC_CONFIGMAP>
    #     items:
    #       - key: model-spec.json
    #         path: model-spec.json
  containers:
    - name: llm-init
      image: <LLM_INIT_IMAGE>
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        - { name: ENGINE_KIND,  value: ollama }
        - { name: MODEL_NAME,   value: <MODEL_NAME> }
        - { name: MODEL_MODE,   value: chat }
        # - { name: MODEL_SUPPORTS, value: "supports_reasoning,supports_vision" }
        - { name: MODEL_SOURCE, value: "<MODEL_SOURCE>" }
        - { name: HF_ENDPOINT,  value: "https://huggingface.co" }
        - { name: ENGINE_ARGS,  value: "<ENGINE_ARGS>" }
        - { name: RUN_DIR,      value: /run/llm-init }
        - { name: PORT,         value: "8080" }
        - { name: LOG_LEVEL,    value: info }
        - { name: LOG_FORMAT,   value: json }
        # Pair with the optional model-spec ConfigMap (disk wins over env):
        # - { name: MODEL_SPEC_PATH, value: /etc/llm-init/model-spec.json }
      ports:
        - { containerPort: 8080, name: http }
      volumeMounts:
        - { name: run-state, mountPath: /run/llm-init }
        # Optional (pairs with the model-spec volume + MODEL_SPEC_PATH):
        # - { name: model-spec, mountPath: /etc/llm-init/model-spec.json, subPath: model-spec.json, readOnly: true }
      livenessProbe:
        httpGet: { path: /livez, port: 8080 }
        periodSeconds: 30
      readinessProbe:
        httpGet: { path: /readyz, port: 8080 }
        periodSeconds: 5
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    - name: engine
      # Pinned to 0.30.0; bump via https://github.com/ollama/ollama/releases.
      image: ollama/ollama:0.30.0
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "/llm-init/wrappers/ollama.sh"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        - { name: ENGINE_KIND,    value: ollama }
        - { name: OLLAMA_HOST,    value: "0.0.0.0:11434" }
        - { name: OLLAMA_NOPRUNE, value: "1" }
        - { name: ENGINE_ARGS,    value: "<ENGINE_ARGS>" }
      volumeMounts:
        - { name: ollama-data, mountPath: /root/.ollama }
        - { name: wrappers,    mountPath: /llm-init/wrappers, readOnly: true }
      ports:
        - { containerPort: 11434, name: ollama }
      readinessProbe:
        # `ollama list` is the cheapest "am I up?" check; tcpSocket
        # reports up before the HTTP listener is ready.
        exec:
          command: ["ollama", "list"]
        initialDelaySeconds: 10
        periodSeconds: 10
      resources:
        requests:
          cpu: 1
          memory: 4Gi
        limits:
          cpu: 4
          memory: 16Gi
        # GPU users uncomment:
        # requests:
        #   nvidia.com/gpu: 1
        # limits:
        #   nvidia.com/gpu: 1
